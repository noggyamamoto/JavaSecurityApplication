# ======================================================
# CONFIGURAÇÃO VULNERÁVEL – para demonstração de Session Hijacking
# ======================================================

# Porta do servidor
server.port=8080

# Banco H2 – console acessível em /h2-console (útil para ver dados)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: cria tabelas automaticamente e mostra SQL no console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ======================================================
# FLAGS DE COOKIE DE SESSÃO – INTENCIONALMENTE INSEGURAS
# ======================================================
# httpOnly=false → JavaScript pode ler o cookie (via document.cookie)
server.servlet.session.cookie.http-only=false

# secure=false → cookie trafega em HTTP (não apenas HTTPS) – vulnerável a sniffing
server.servlet.session.cookie.secure=false

# same-site=lax → menos restritivo que 'strict'; permite envio em certas requisições cross-site
server.servlet.session.cookie.same-site=lax

# Nome padrão do cookie de sessão
server.servlet.session.cookie.name=JSESSIONID